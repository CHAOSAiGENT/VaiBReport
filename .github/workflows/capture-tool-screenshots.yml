name: Capture screenshots for Me2 tool (E-03)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Tool slug (filename without .md from _tools/)"
        required: true

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Capture tool screenshots
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          node --input-type=module << 'SCRIPT'
          import fs from 'fs';
          import path from 'path';
          import { chromium } from 'playwright';

          const slug = process.env.SLUG;
          const toolPath = `_tools/${slug}.md`;

          // Cookie banner selectors to try dismissing
          const COOKIE_SELECTORS = [
            '#onetrust-accept-btn-handler',
            '[aria-label="Accept cookies"]',
            '[aria-label="Accept all cookies"]',
            '.cc-btn.cc-allow',
            '#accept-cookies',
          ];

          // ── Parse frontmatter from a .md file ──────────────────────
          function parseFrontmatter(content) {
            const match = content.match(/^---\n([\s\S]*?)\n---/);
            if (!match) return {};
            const fm = {};
            for (const line of match[1].split('\n')) {
              const m = line.match(/^(\w[\w_]*):\s*"?([^"]*)"?\s*$/);
              if (m) fm[m[1]] = m[2].trim();
            }
            return fm;
          }

          // ── Update a frontmatter field in a .md file ───────────────
          function setFrontmatterField(filePath, field, value) {
            let content = fs.readFileSync(filePath, 'utf8');
            const fieldRegex = new RegExp(`^(${field}:\\s*).*$`, 'm');
            if (fieldRegex.test(content)) {
              content = content.replace(fieldRegex, `$1"${value}"`);
            } else {
              // Field not present — insert before closing ---
              content = content.replace(/^(---\n[\s\S]*?)\n---/, `$1\n${field}: "${value}"\n---`);
            }
            fs.writeFileSync(filePath, content, 'utf8');
          }

          // ── Validate tool file exists ──────────────────────────────
          if (!fs.existsSync(toolPath)) {
            console.error(`ERROR: Tool file not found: ${toolPath}`);
            console.error(`Available files in _tools/:`);
            if (fs.existsSync('_tools')) {
              fs.readdirSync('_tools').forEach(f => console.error(`  ${f}`));
            } else {
              console.error('  _tools/ directory does not exist');
            }
            process.exit(1);
          }

          // ── Read tool metadata ─────────────────────────────────────
          const content = fs.readFileSync(toolPath, 'utf8');
          const fm = parseFrontmatter(content);

          const demoUrl = fm['demo_url'] || '';
          const baseUrl = fm['url'] || '';
          const targetUrl = (demoUrl && demoUrl !== '') ? demoUrl : baseUrl;

          if (!targetUrl) {
            console.error(`ERROR: No url or demo_url found in ${toolPath}`);
            process.exit(1);
          }

          console.log(`Tool: ${slug}`);
          console.log(`URL: ${targetUrl}${demoUrl ? ' (demo_url)' : ' (url)'}`);

          // ── Prepare output directory ──────────────────────────────
          const screenshotDir = `static/screenshots/${slug}`;
          fs.mkdirSync(screenshotDir, { recursive: true });

          const desktopPath = `${screenshotDir}/${slug}-desktop.png`;
          const mobilePath  = `${screenshotDir}/${slug}-mobile.png`;
          const fullPath    = `${screenshotDir}/${slug}-full.png`;

          // ── Capture ───────────────────────────────────────────────
          let navigationFailed = false;
          const browser = await chromium.launch();

          try {
            const context = await browser.newContext({
              viewport: { width: 1280, height: 800 },
            });
            const page = await context.newPage();

            try {
              await page.goto(targetUrl, { timeout: 20000, waitUntil: 'networkidle' });
            } catch (navErr) {
              console.warn(`Navigation warning: ${navErr.message}`);
              navigationFailed = true;
            }

            if (!navigationFailed) {
              // Dismiss cookie banners
              for (const sel of COOKIE_SELECTORS) {
                try {
                  const el = await page.$(sel);
                  if (el) {
                    await el.click();
                    await page.waitForTimeout(500);
                    break;
                  }
                } catch (_) {
                  // Ignore — selector not found or click failed
                }
              }

              // Desktop screenshot (1280x800, above-the-fold)
              await page.setViewportSize({ width: 1280, height: 800 });
              await page.screenshot({ path: desktopPath, fullPage: false });
              console.log(`  ✓ Desktop: ${desktopPath}`);

              // Mobile screenshot (390x844)
              await page.setViewportSize({ width: 390, height: 844 });
              await page.screenshot({ path: mobilePath, fullPage: false });
              console.log(`  ✓ Mobile:  ${mobilePath}`);

              // Full-page desktop (for reference)
              await page.setViewportSize({ width: 1280, height: 800 });
              await page.screenshot({ path: fullPath, fullPage: true });
              console.log(`  ✓ Full:    ${fullPath}`);
            } else {
              console.warn(`Skipping screenshots for ${slug} — navigation failed`);
            }

            await context.close();
          } catch (err) {
            console.warn(`Screenshot error for ${slug}: ${err.message}`);
            navigationFailed = true;
          }

          await browser.close();

          // ── Update frontmatter if captures succeeded ───────────────
          if (!navigationFailed) {
            setFrontmatterField(toolPath, 'screenshot_desktop', desktopPath);
            setFrontmatterField(toolPath, 'screenshot_mobile', mobilePath);
            console.log(`Updated frontmatter in ${toolPath}`);
          }

          // Write a summary env file for the summary step
          const summaryLines = navigationFailed
            ? [`CAPTURE_STATUS=failed`, `CAPTURE_SLUG=${slug}`, `CAPTURE_URL=${targetUrl}`]
            : [`CAPTURE_STATUS=success`, `CAPTURE_SLUG=${slug}`, `CAPTURE_URL=${targetUrl}`, `CAPTURE_DESKTOP=${desktopPath}`, `CAPTURE_MOBILE=${mobilePath}`, `CAPTURE_FULL=${fullPath}`];

          fs.writeFileSync('/tmp/capture-result.env', summaryLines.join('\n') + '\n', 'utf8');
          SCRIPT

      - name: Commit screenshots and frontmatter updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/screenshots/ _tools/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add screenshots for tool ${{ github.event.inputs.slug }} (E-03)"
            git push
          fi

      - name: Summary
        run: |
          if [ -f /tmp/capture-result.env ]; then
            source /tmp/capture-result.env
            if [ "$CAPTURE_STATUS" = "success" ]; then
              echo "## Screenshot capture complete" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Tool:** \`${CAPTURE_SLUG}\`" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** ${CAPTURE_URL}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| File | Path |" >> $GITHUB_STEP_SUMMARY
              echo "|------|------|" >> $GITHUB_STEP_SUMMARY
              echo "| Desktop | \`${CAPTURE_DESKTOP}\` |" >> $GITHUB_STEP_SUMMARY
              echo "| Mobile  | \`${CAPTURE_MOBILE}\`  |" >> $GITHUB_STEP_SUMMARY
              echo "| Full    | \`${CAPTURE_FULL}\`    |" >> $GITHUB_STEP_SUMMARY
            else
              echo "## Screenshot capture failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Tool:** \`${CAPTURE_SLUG}\`" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** ${CAPTURE_URL}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Navigation failed — no screenshots saved. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No capture result file found — the Node script may have exited early." >> $GITHUB_STEP_SUMMARY
          fi
