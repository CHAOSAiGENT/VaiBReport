name: Research Topic

on:
  issues:
    types: [labeled]

jobs:
  research:
    if: contains(github.event.issue.labels.*.name, 'research-request')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate research report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          node --input-type=module << 'SCRIPT'
          import fs from 'fs';
          import { execSync } from 'child_process';

          const ANTHROPIC_KEY  = process.env.ANTHROPIC_API_KEY;
          const PERPLEXITY_KEY = process.env.PERPLEXITY_API_KEY;
          const GITHUB_TOKEN   = process.env.GH_TOKEN;
          const ISSUE_NUMBER   = process.env.ISSUE_NUMBER;
          const ISSUE_BODY     = process.env.ISSUE_BODY || '';
          const ISSUE_TITLE    = process.env.ISSUE_TITLE || '';

          if (!ANTHROPIC_KEY) { console.error('ANTHROPIC_API_KEY not set'); process.exit(1); }

          // ── Parse issue body ────────────────────────────────────────
          function field(label) {
            const m = ISSUE_BODY.match(new RegExp(`###\\s+${label}\\s*\\n+([\\s\\S]*?)(?=\\n###|$)`, 'i'));
            return m ? m[1].trim() : '';
          }

          const topic        = field('Topic / what you\'re looking for') || ISSUE_TITLE.replace(/^\[Research\]\s*/i, '').trim();
          const context      = field('Context and constraints');
          const referenceUrl = field('Reference tool \\(optional\\)');
          const depth        = field('Report depth') || 'Standard';
          const publicStr    = field('Make report public\\?') || 'No';
          const isPublic     = publicStr.toLowerCase().includes('yes');

          // Parse ICP checkboxes
          const icpSection = field('ICPs to focus on');
          const icpMap = {
            'founding team':   'founding-team',
            'solopreneur':     'solopreneur',
            'small business':  'small-business',
            'pre-mvp':         'pre-mvp',
            'entreprecurious': 'entreprecurious',
            'non-technical':   'non-technical',
          };
          const icps = Object.entries(icpMap)
            .filter(([label]) => icpSection.toLowerCase().includes(label))
            .map(([, slug]) => slug);
          if (icps.length === 0) icps.push('solopreneur', 'founding-team');

          const today = new Date().toISOString().slice(0, 10);
          const slug  = topic.toLowerCase()
            .replace(/[^a-z0-9\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '')
            .slice(0, 60);

          const depthLevel = depth.toLowerCase().includes('quick') ? 'quick'
            : depth.toLowerCase().includes('deep') ? 'deep' : 'standard';

          const topN = depthLevel === 'quick' ? 5 : depthLevel === 'deep' ? 12 : 8;

          console.log(`Topic:    ${topic}`);
          console.log(`Slug:     ${slug}`);
          console.log(`Depth:    ${depthLevel} (top ${topN})`);
          console.log(`ICPs:     ${icps.join(', ')}`);
          console.log(`Public:   ${isPublic}`);
          console.log(`Ref URL:  ${referenceUrl || '(none)'}`);

          // ── Brave Search — live web search (replaces Perplexity) ────────
          async function searchWeb(query) {
            const BRAVE_KEY = process.env.BRAVE_SEARCH_API_KEY;
            const PERPLEXITY_KEY = process.env.PERPLEXITY_API_KEY;

            // Brave preferred (cheaper, attribution required on site)
            if (BRAVE_KEY) {
              try {
                const res = await fetch(
                  `https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&freshness=pw&count=15`,
                  { headers: { 'X-Subscription-Token': BRAVE_KEY, 'Accept': 'application/json' } }
                );
                if (!res.ok) throw new Error(`Brave ${res.status}`);
                const data = await res.json();
                const results = data.web?.results ?? [];
                const formatted = results.map(r => `- ${r.title}\n  ${r.url}\n  ${r.description || ''}`).join('\n');
                console.log(`Brave Search returned ${results.length} results`);
                return formatted || null;
              } catch (e) {
                console.warn(`Brave Search failed: ${e.message} — trying Perplexity`);
              }
            }

            // Perplexity fallback
            if (PERPLEXITY_KEY) {
              try {
                const res = await fetch('https://api.perplexity.ai/chat/completions', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${PERPLEXITY_KEY}` },
                  body: JSON.stringify({
                    model: 'sonar-pro',
                    messages: [
                      { role: 'system', content: 'Find current tools. Include GitHub URLs, pricing, release dates. Prioritise open-source and indie tools.' },
                      { role: 'user', content: query },
                    ],
                    max_tokens: 2000,
                  }),
                });
                if (!res.ok) throw new Error(`Perplexity ${res.status}`);
                const data = await res.json();
                const text = data.choices?.[0]?.message?.content || null;
                if (text) console.log(`Perplexity returned ${text.length} chars`);
                return text;
              } catch (e) {
                console.warn(`Perplexity failed: ${e.message}`);
              }
            }

            console.warn('No search provider available — skipping web search');
            return null;
          }

          // ── LLM cascade (research: Gemini Pro → OpenRouter Nemotron → Sonnet) ─
          async function callLLM(prompt, maxTokens = 4000) {
            const providers = [];
            if (process.env.GEMINI_API_KEY) {
              providers.push({
                name: 'gemini-pro',
                call: async () => {
                  const body = { contents: [{ role: 'user', parts: [{ text: prompt }] }] };
                  const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${process.env.GEMINI_API_KEY}`,
                    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
                  );
                  if (!res.ok) throw new Error(`Gemini Pro ${res.status}: ${await res.text()}`);
                  const d = await res.json();
                  return d.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
                },
              });
            }
            if (process.env.OPENROUTER_API_KEY) {
              providers.push({
                name: 'openrouter-nemotron',
                call: async () => {
                  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}` },
                    body: JSON.stringify({ model: 'nvidia/llama-3.1-nemotron-ultra-253b-v1:free', messages: [{ role: 'user', content: prompt }] }),
                  });
                  if (!res.ok) throw new Error(`OpenRouter ${res.status}`);
                  const d = await res.json();
                  return d.choices?.[0]?.message?.content ?? '';
                },
              });
            }
            if (ANTHROPIC_KEY) {
              providers.push({
                name: 'claude-sonnet',
                call: async () => {
                  const res = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': ANTHROPIC_KEY, 'anthropic-version': '2023-06-01' },
                    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: maxTokens, messages: [{ role: 'user', content: prompt }] }),
                  });
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error?.message || res.status);
                  return data.content[0].text;
                },
              });
            }
            for (const p of providers) {
              try {
                const text = await p.call();
                console.log(`[LLM research] Used ${p.name}`);
                return text;
              } catch (err) {
                console.warn(`[LLM research] ${p.name} failed: ${err.message}`);
              }
            }
            throw new Error('All LLM providers exhausted for research report');
          }

          // ── Pre-flight: Check Anthropic balance ─────────────────────
          async function checkAnthropicBalance() {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': ANTHROPIC_KEY,
                'anthropic-version': '2023-06-01',
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 5,
                messages: [{ role: 'user', content: 'ping' }],
              }),
            });
            if (res.status === 402) {
              const commentRes = await fetch(
                `https://api.github.com/repos/CHAOSAiGENT/VaiBReport/issues/${ISSUE_NUMBER}/comments`,
                {
                  method: 'POST',
                  headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ body: '⚠️ **Research report could not run**: Anthropic API credit balance is too low. Top up the account and re-label this issue `research-request` to retry.' }),
                }
              );
              console.error('Anthropic balance too low — commented on issue and exiting');
              process.exit(1);
            }
            if (!res.ok) {
              console.warn(`Anthropic pre-flight returned ${res.status} — proceeding anyway`);
            } else {
              console.log('Anthropic pre-flight OK');
            }
          }

          await checkAnthropicBalance();

          // ── Step 1: Web search ──────────────────────────────────────
          const searchQuery = [
            `Best tools for: ${topic}.`,
            context ? `Context: ${context}` : '',
            referenceUrl ? `Also research this specific tool: ${referenceUrl}` : '',
            `Find the top ${topN} options including open-source, commercial, and self-hosted.`,
            `For each: name, URL or GitHub repo, brief description, pricing, key strengths, key weaknesses, recent updates.`,
          ].filter(Boolean).join(' ');

          console.log('Calling search for web research...');
          const webResearch = await searchWeb(searchQuery);

          // ── Step 2: Claude structures the report ────────────────────
          const icpDescriptions = {
            'founding-team':   'Small founding teams (2-5 people, moving fast, need to avoid hiring)',
            'solopreneur':     'Solopreneurs (one person, cost-sensitive, needs to run solo)',
            'small-business':  'Small business owners (non-technical, needs tools that just work)',
            'pre-mvp':         'Pre-MVP teams (building first version, stack decisions matter)',
            'entreprecurious': 'Entreprecurious (curious about building, not committed yet)',
            'non-technical':   'Non-technical investigators (want signal, not implementation details)',
          };
          const icpContext = icps.map(i => icpDescriptions[i] || i).join('; ');

          const structurePrompt = `You are writing a research report for Peter, a technical consultant who advises small founding teams, solopreneurs, and small business owners.

          Peter's voice: direct, dry humour, opinionated, honest about limitations. No hype words.

          ## Research request
          Topic: ${topic}
          ${context ? `Context: ${context}` : ''}
          ${referenceUrl ? `Reference tool spotted by Peter: ${referenceUrl}` : ''}
          Target audiences: ${icpContext}
          Report depth: ${depthLevel} (include ${topN} tools)

          ## Web research data (from Perplexity live search)
          ${webResearch || '(no live web data available — use your training knowledge)'}

          ---

          Write a structured research report as Markdown. Use exactly this structure:

          # ${topic}
          *Research report · ${today}*

          ## TL;DR
          2-3 sentences. What the landscape looks like right now. Peter's top recommendation.

          ## Landscape overview
          1 paragraph. What's mature vs. emerging. Where the interesting movement is happening.

          ## Tool comparison

          | Tool | Type | Price | Best for | Limitation |
          |------|------|-------|----------|------------|
          (one row per tool, top ${topN}, include the reference tool if provided)

          ## Top picks

          For each of the top 3-4 tools, a short section:
          ### [Tool name](url)
          - **What it is:** one sentence
          - **Why it's interesting:** what makes it different
          - **Best for:** specific ICP + use case
          - **The catch:** honest limitation
          - **Get it:** link

          ## ICP use cases
          ${icps.map(icp => `### ${icpDescriptions[icp] || icp}\nBrief paragraph on how this ICP should approach this tool category. Which 1-2 tools make most sense for them and why.`).join('\n\n')}

          ## Peter's recommendation
          If Peter had to choose one tool from this list to test this week, which one and why. Keep it opinionated. Name the ICP it's right for.

          ## Resources
          - Links to key GitHub repos, docs, comparisons found during research`;

          console.log('Calling LLM to structure report...');
          const reportMarkdown = await callLLM(structurePrompt, 4000);
          console.log(`LLM returned ${reportMarkdown.length} chars`);

          // ── Step 3: Write _research/{slug}.md ─────────────────────
          fs.mkdirSync('_research', { recursive: true });
          const filePath = `_research/${slug}.md`;

          const frontmatter = [
            '---',
            `title: "${topic.replace(/"/g, '\\"')}"`,
            `slug: ${slug}`,
            `date_added: "${today}"`,
            `issue_number: ${ISSUE_NUMBER}`,
            `depth: ${depthLevel}`,
            `icps: [${icps.map(i => `"${i}"`).join(', ')}]`,
            referenceUrl ? `reference_url: "${referenceUrl}"` : '',
            `public: ${isPublic}`,
            '---',
          ].filter(Boolean).join('\n');

          fs.writeFileSync(filePath, frontmatter + '\n\n' + reportMarkdown + '\n');
          console.log(`Wrote ${filePath}`);

          // ── Step 4: Commit ──────────────────────────────────────────
          execSync('git config user.name "VaiBReport Bot"');
          execSync('git config user.email "bot@vaib.report"');
          execSync(`git add _research/`);

          const diffResult = execSync('git diff --cached --quiet; echo $?').toString().trim();
          if (diffResult !== '0') {
            execSync(`git commit -m "feat: research report — ${topic.slice(0, 60)} [automated]"`);
            execSync('git push origin main');
            console.log('Committed and pushed');
          } else {
            console.log('No changes to commit');
          }

          // ── Step 5: Comment on issue ────────────────────────────────
          const baseUrl = 'https://chaosaigent.github.io/VaiBReport';
          const pageUrl = `${baseUrl}/research/${slug}/`;
          const visibility = isPublic ? 'public' : 'private (`/my-research/` only)';

          const comment = [
            `✅ **Research report generated**: [${topic}](${pageUrl})`,
            '',
            `| Field | Value |`,
            `|-------|-------|`,
            `| Depth | ${depthLevel} |`,
            `| Tools covered | ~${topN} |`,
            `| ICPs | ${icps.join(', ')} |`,
            `| Visibility | ${visibility} |`,
            referenceUrl ? `| Reference tool | ${referenceUrl} |` : '',
            '',
            `> Site rebuilds in ~2 minutes. The page will be live at: ${pageUrl}`,
          ].filter(s => s !== null).join('\n');

          const commentRes = await fetch(
            `https://api.github.com/repos/CHAOSAiGENT/VaiBReport/issues/${ISSUE_NUMBER}/comments`,
            {
              method: 'POST',
              headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ body: comment }),
            }
          );
          if (commentRes.ok) console.log('Commented on issue');

          await fetch(
            `https://api.github.com/repos/CHAOSAiGENT/VaiBReport/issues/${ISSUE_NUMBER}`,
            {
              method: 'PATCH',
              headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ state: 'closed' }),
            }
          );
          console.log('Closed issue');
          SCRIPT
