name: Generate daily digest

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Check local LLM availability
        id: local_check
        run: |
          if curl --silent --max-time 5 \
              -H "Authorization: Bearer ${{ secrets.LITELLM_MASTER_KEY }}" \
              http://100.96.142.54:4000/health > /dev/null 2>&1; then
            echo "local_available=true" >> $GITHUB_OUTPUT
          else
            echo "local_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate digest post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LOCAL_LLM_AVAILABLE: ${{ steps.local_check.outputs.local_available }}
        run: |
          node --input-type=module << 'SCRIPT'
          import fs from 'fs';
          import { validateCompareTo } from './scripts/lib/validator.js';
          import { mergeOverrides, validateSlugs } from './scripts/lib/overrides.js';

          // ── Helpers ────────────────────────────────────────
          function formatStars(n) {
            if (n >= 1000) return `${(n / 1000).toFixed(1).replace(/\.0$/, '')}k★`;
            return `${n}★`;
          }

          function formatDownloads(n) {
            if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M`;
            if (n >= 1000) return `${(n / 1000).toFixed(0)}K`;
            return `${n}`;
          }

          function monthsAgo(dateStr, months) {
            if (!dateStr) return true;
            const d = new Date(dateStr);
            const cutoff = new Date();
            cutoff.setMonth(cutoff.getMonth() - months);
            return d >= cutoff;
          }

          function loadLatestDataFile(prefix) {
            try {
              const files = fs.readdirSync('data')
                .filter(f => f.match(new RegExp(`^${prefix}-\\d{4}-\\d{2}-\\d{2}\\.json$`)))
                .sort()
                .reverse();
              if (files.length > 0) {
                const data = JSON.parse(fs.readFileSync(`data/${files[0]}`, 'utf8'));
                console.log(`Loaded ${prefix} data from ${files[0]}`);
                return data;
              }
            } catch (e) {
              console.log(`No ${prefix} data available`);
            }
            return null;
          }

          function loadSeenLedger(filename) {
            try {
              return JSON.parse(fs.readFileSync(`data/${filename}`, 'utf8'));
            } catch (e) {
              return { featured: {} };
            }
          }

          function isOnCooldown(seenLedger, id, today, cooldownDays) {
            const entry = seenLedger.featured[id];
            if (!entry) return false;
            const lastDate = new Date(entry.last_featured);
            const diff = (today - lastDate) / (1000 * 60 * 60 * 24);
            return diff < cooldownDays;
          }

          function markSeen(seenLedger, id, digestDate) {
            const entry = seenLedger.featured[id] || { times_featured: 0 };
            entry.last_featured = digestDate;
            entry.times_featured = (entry.times_featured || 0) + 1;
            seenLedger.featured[id] = entry;
          }

          // ── Category assignment ────────────────────────────
          const UGC_EXCLUSIONS = /public.apis|awesome-|free-for-dev|fastapi|playwright|puppeteer|firecrawl|web.scraping|headless.browser|http.client|api.framework|web.framework/i;

          function assignCategory(repo) {
            const t = (repo.topics || []).join(' ').toLowerCase();
            const d = (repo.description || '').toLowerCase();
            const g = (repo._query_group || '').toLowerCase();
            const all = `${t} ${d} ${g}`;

            if (!UGC_EXCLUSIONS.test(all) &&
                (g.includes('ugc_social') ||
                 all.match(/social.media.(?:schedul|manag|post|automat)|content.creat(?:ion|or).tool|video.generat|video.edit|ai.art|ai.image|image.generat|digital.twin|avatar.generat|ugc.platform|creator.econom|tiktok.(?:bot|tool|schedul)|instagram.(?:bot|tool|schedul)/)))
              return 'UGC, social media and creator tools';
            if (all.match(/llm|agent|rag|vector|mlops|ai.infra|lm.studio|openai|anthropic|langchain|embedding/))
              return 'AI agents, LLM infra and RAG';
            if (all.match(/saas.*(boilerplate|starter|template|kit)|boilerplate.*saas|starter.*saas/))
              return 'SaaS starters and templates';
            if (all.match(/billing|subscription|analytics|dashboard|project.manage|workflow|automation|ops|monitoring|devtool/))
              return 'Ops, analytics and automation';
            if (all.match(/marketing|landing.page|email|crm|sales|seo|gtm|outreach|newsletter/))
              return 'Marketing, sales and GTM tools';
            if (all.match(/template|boilerplate|starter|scaffold|ui.component|design.system/))
              return 'SaaS starters and templates';
            return null;
          }

          // ── LLM cascade (blurbs: Local → NVIDIA NIM (5 models) → Gemini Flash → OpenRouter → Groq → Haiku) ─
          async function tryCascadeBlurb(prompt) {
            const providers = [];
            if (process.env.LOCAL_LLM_AVAILABLE === 'true' && process.env.LITELLM_MASTER_KEY) {
              providers.push({
                name: 'local-qwen3-14b',
                call: async () => {
                  const res = await fetch('http://100.96.142.54:4000/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.LITELLM_MASTER_KEY}` },
                    body: JSON.stringify({ model: 'local/qwen3-14b', messages: [{ role: 'system', content: '/no_think' }, { role: 'user', content: prompt }] }),
                  });
                  if (!res.ok) throw new Error(`LiteLLM ${res.status}: ${await res.text()}`);
                  const d = await res.json();
                  return d.choices?.[0]?.message?.content ?? '';
                },
              });
            }
            if (process.env.NVIDIA_API_KEY) {
              const nimModels = [
                'meta/llama-3.3-70b-instruct',
                'nvidia/llama-3.1-nemotron-70b-instruct',
                'mistralai/mixtral-8x22b-instruct-v0.1',
                'qwen/qwen2.5-72b-instruct',
                'meta/llama-3.1-405b-instruct',
              ];
              for (const model of nimModels) {
                providers.push({
                  name: `nim-${model}`,
                  call: async () => {
                    const res = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}` },
                      body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }] }),
                    });
                    if (!res.ok) throw new Error(`NIM ${model} ${res.status}: ${await res.text()}`);
                    const d = await res.json();
                    return d.choices?.[0]?.message?.content ?? '';
                  },
                });
              }
            }
            if (process.env.GEMINI_API_KEY) {
              providers.push({
                name: 'gemini-flash',
                call: async () => {
                  const body = { contents: [{ role: 'user', parts: [{ text: prompt }] }] };
                  const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
                    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
                  );
                  if (!res.ok) throw new Error(`Gemini ${res.status}: ${await res.text()}`);
                  const d = await res.json();
                  return d.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
                },
              });
            }
            if (process.env.OPENROUTER_API_KEY) {
              providers.push({
                name: 'openrouter-llama-70b',
                call: async () => {
                  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}` },
                    body: JSON.stringify({ model: 'meta-llama/llama-3.3-70b-instruct:free', messages: [{ role: 'user', content: prompt }] }),
                  });
                  if (!res.ok) throw new Error(`OpenRouter ${res.status}`);
                  const d = await res.json();
                  return d.choices?.[0]?.message?.content ?? '';
                },
              });
            }
            if (process.env.GROQ_API_KEY) {
              providers.push({
                name: 'groq-llama-70b',
                call: async () => {
                  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.GROQ_API_KEY}` },
                    body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: [{ role: 'user', content: prompt }] }),
                  });
                  if (!res.ok) throw new Error(`Groq ${res.status}`);
                  const d = await res.json();
                  return d.choices?.[0]?.message?.content ?? '';
                },
              });
            }
            if (process.env.ANTHROPIC_API_KEY) {
              providers.push({
                name: 'claude-haiku',
                call: async () => {
                  const res = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': process.env.ANTHROPIC_API_KEY, 'anthropic-version': '2023-06-01' },
                    body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 4096, messages: [{ role: 'user', content: prompt }] }),
                  });
                  if (!res.ok) throw new Error(`Claude ${res.status}: ${await res.text()}`);
                  const d = await res.json();
                  return d.content[0].text;
                },
              });
            }
            for (const p of providers) {
              try {
                const text = await p.call();
                console.log(`[LLM blurbs] Used ${p.name}`);
                process.env.LAST_LLM_MODEL_USED = p.name.replace(/^nim-/, '');
                return text;
              } catch (err) {
                console.warn(`[LLM blurbs] ${p.name} failed: ${err.message}`);
              }
            }
            throw new Error('All LLM providers exhausted for blurbs');
          }

          // ── Editorial blurbs ────────────────────────────────────────
          async function generateEditorialBlurbs(repos, sections) {
            const hasAnyKey = (process.env.LOCAL_LLM_AVAILABLE === 'true' && process.env.LITELLM_MASTER_KEY) ||
              process.env.GEMINI_API_KEY || process.env.OPENROUTER_API_KEY ||
              process.env.GROQ_API_KEY || process.env.ANTHROPIC_API_KEY;
            if (!hasAnyKey) {
              console.log('No LLM keys configured — falling back to template blurbs');
              return null;
            }

            let repoList = '';
            for (const [section, items] of Object.entries(sections)) {
              if (items.length === 0) continue;
              repoList += `\n## ${section}\n`;
              for (const r of items) {
                const id = r.full_name || r.id || r.name || '';
                repoList += `- ${id} (${r.language || r._source || 'Multi'}, ${r.stargazers_count || r.likes || r.downloads || 0}): ${r.description || 'No description'}\n`;
                if (r.topics && r.topics.length > 0) {
                  repoList += `  Topics: ${r.topics.slice(0, 8).join(', ')}\n`;
                }
              }
            }

            const prompt = [
              'You are writing editorial copy for a daily digest blog called VaiBReport. The audience is solo founders, AI/B2B SaaS builders, small business owners, and content creators.',
              '',
              'Voice: casual, dry humor, opinionated. You are a fellow builder who has seen a lot of tools and knows what actually matters. Think "the friend who texts you \'hey check this out\' with actually good stuff." Each blurb is ONE sentence, max 20 words. No fluff. No hype words (no "revolutionary", "game-changing", "incredible", "powerful"). Say what it does and why a builder would care.',
              '',
              'For each item below, return THREE fields:',
              '1. blurb: one editorial sentence as described above.',
              '2. replaces: an array of up to 5 real, currently-active commercial products this open-source item could plausibly substitute for. Each entry has {name, url, note}. note is <=60 chars and optional. If you do not know real products with confidence, return []. DO NOT INVENT product names.',
              '3. similar_to: an array of up to 4 slugs of similar items elsewhere in the VaiBReport catalog. Slugs use the format "owner--repo" (double-dash). If unsure, return []. DO NOT INVENT slugs.',
              '',
              'Return ONLY valid JSON. No markdown, no explanation, no trailing commas.',
              '',
              repoList,
              '',
              'Return format:',
              '{',
              '  "owner/repo": {',
              '    "blurb": "One-liner blurb here.",',
              '    "replaces": [{"name": "Notion", "url": "https://www.notion.so", "note": "knowledge base"}],',
              '    "similar_to": ["calcom--calcom", "agent-browser"]',
              '  }',
              '}'
            ].join('\n');

            try {
              const text = await tryCascadeBlurb(prompt);
              const cleaned = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
              const raw = JSON.parse(cleaned);
              // Normalize: tolerate either flat-string (legacy) or nested-object shape.
              const normalized = {};
              for (const [key, val] of Object.entries(raw)) {
                if (typeof val === 'string') {
                  normalized[key] = { blurb: val, replaces: [], similar_to: [] };
                } else if (val && typeof val === 'object') {
                  normalized[key] = {
                    blurb: val.blurb || '',
                    replaces: Array.isArray(val.replaces) ? val.replaces.slice(0, 5) : [],
                    similar_to: Array.isArray(val.similar_to) ? val.similar_to.slice(0, 4) : [],
                  };
                }
              }
              console.log(`Got ${Object.keys(normalized).length} editorial entries (with compare-to)`);
              return normalized;
            } catch (e) {
              console.error('LLM blurb generation failed:', e.message);
              return null;
            }
          }

          function writeOneLiner(repo, blurbs) {
            const lang = repo.language || 'Multi';
            const stars = formatStars(repo.stargazers_count);
            const blurb = (blurbs && blurbs[repo.full_name]?.blurb)
              ? blurbs[repo.full_name].blurb
              : (repo.description || 'No description provided.');
            return `- [${repo.full_name}](${repo.html_url}) – ${blurb} (${lang}, ${stars})`;
          }

          // ── README media extraction ─────────────────────────
          const BADGE_PATTERNS = [
            /shields\.io/, /img\.shields\.io/, /badge\.fury\.io/,
            /github\.com\/.*\/workflows\//, /actions\/workflows/,
            /travis-ci/, /circleci/, /codecov/, /snyk\.io/,
            /badge\.svg/, /badgen\.net/, /flat\.badge/
          ];

          async function fetchReadmeImage(fullName) {
            try {
              const res = await fetch(
                `https://api.github.com/repos/${fullName}/readme`,
                { headers: { 'Authorization': `token ${process.env.GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' } }
              );
              if (!res.ok) return null;
              const data = await res.json();
              const content = Buffer.from(data.content, 'base64').toString('utf8');
              // Extract markdown images: ![alt](url) and HTML <img src="url">
              const mdImages = [...content.matchAll(/!\[.*?\]\((https?:\/\/[^\s)]+)\)/g)].map(m => m[1]);
              const htmlImages = [...content.matchAll(/<img[^>]+src=["'](https?:\/\/[^"']+)["']/gi)].map(m => m[1]);
              const all = [...mdImages, ...htmlImages];
              const hero = all.find(url => !BADGE_PATTERNS.some(p => p.test(url)));
              return hero || null;
            } catch (e) {
              return null;
            }
          }

          // ── Repo catalog entry creator ─────────────────────
          function toSlug(id) {
            return id.toLowerCase().replace(/\//g, '--').replace(/[^a-z0-9-]/g, '');
          }

          function parseFrontMatter(content) {
            const match = content.match(/^---\n([\s\S]*?)\n---/);
            if (!match) return {};
            const fm = {};
            for (const line of match[1].split('\n')) {
              const m = line.match(/^(\w[\w_]*)\s*:\s*(.+)$/);
              if (m) {
                let val = m[2].trim();
                if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                if (/^\d+$/.test(val)) val = parseInt(val, 10);
                fm[m[1]] = val;
              }
            }
            return fm;
          }

          const SECTION_ICP = {
            'SaaS starters and templates':        ['founding-team', 'solopreneur', 'pre-mvp'],
            'AI agents, LLM infra and RAG':       ['founding-team', 'pre-mvp', 'entreprecurious'],
            'Ops, analytics and automation':       ['solopreneur', 'small-business', 'founding-team'],
            'Marketing, sales and GTM tools':     ['solopreneur', 'small-business', 'non-technical'],
            'UGC, social media and creator tools':['solopreneur', 'non-technical', 'entreprecurious'],
            'Trending':                            ['founding-team', 'entreprecurious'],
            'HuggingFace Spaces':                 ['non-technical', 'solopreneur', 'entreprecurious'],
            'HuggingFace Models':                 ['founding-team', 'pre-mvp'],
            'HuggingFace Datasets':               ['founding-team', 'pre-mvp'],
            'Replicate Models':                   ['non-technical', 'solopreneur'],
            'Papers to Code':                     ['founding-team', 'entreprecurious'],
            'npm Packages':                       ['founding-team', 'solopreneur'],
            'PyPI Packages':                      ['founding-team', 'solopreneur'],
            'GitLab Repos':                       ['founding-team', 'solopreneur'],
            'Ollama Models':                      ['non-technical', 'pre-mvp', 'entreprecurious'],
            'New Launches':                       ['solopreneur', 'small-business', 'non-technical'],
          };

          function createRepoEntry(item, source, category, blurbs, hotness, digestDate) {
            const id = item.id || item.full_name || item.name || '';
            const slug = toSlug(id);
            if (!slug) return null;

            const filePath = `_repos/${slug}.md`;
            const blurb = (blurbs && blurbs[id]?.blurb) || item.description || item.name || id;
            const safeBlurb = blurb.replace(/"/g, '\\"');
            const safeName = (item.name || item.full_name || id).replace(/"/g, '\\"');

            // Platform-specific field mapping
            let url = '', stars = 0, downloads = 0, likes = 0, og_image = '';
            const lang = item.language || '';
            const tags = (item.topics || item.tags || item.keywords || []).slice(0, 8);
            tags.unshift(source.split('-')[0]);
            const icpTags = SECTION_ICP[category] || [];

            switch (source) {
              case 'github':
                url = item.html_url || `https://github.com/${item.full_name}`;
                stars = item.stargazers_count || 0;
                og_image = `https://opengraph.githubassets.com/1/${item.full_name}`;
                break;
              case 'huggingface-space':
                url = item.url || `https://huggingface.co/spaces/${id}`;
                likes = item.likes || 0;
                og_image = `https://huggingface.co/api/spaces/${id}/screenshot`;
                break;
              case 'huggingface-model':
                url = item.url || `https://huggingface.co/${id}`;
                downloads = item.downloads || 0;
                likes = item.likes || 0;
                break;
              case 'huggingface-dataset':
                url = item.url || `https://huggingface.co/datasets/${id}`;
                downloads = item.downloads || 0;
                break;
              case 'replicate':
                url = item.url || '';
                og_image = item.cover_image_url || '';
                break;
              case 'paperswithcode':
                url = item.url || '';
                stars = item.github_stars || 0;
                break;
              case 'npm':
                url = item.url || `https://www.npmjs.com/package/${id}`;
                downloads = item.weekly_downloads || 0;
                break;
              case 'pypi':
                url = item.url || `https://pypi.org/project/${id}/`;
                downloads = item.recent_downloads || 0;
                break;
              case 'gitlab':
                url = item.url || '';
                stars = item.star_count || 0;
                break;
              case 'ollama':
                url = item.url || `https://ollama.com/library/${id}`;
                break;
              case 'launch':
                url = item.url || '';
                likes = item.upvotes || 0;
                break;
            }

            const hKey = item.full_name || id;
            const hEntry = (hotness && hotness[hKey]) || {};
            const streak = hEntry.streak || 0;
            const appearances = hEntry.appearances || 0;
            const starVelocity = hEntry.star_velocity || 0;

            if (fs.existsSync(filePath)) {
              // Update existing entry
              const existing = fs.readFileSync(filePath, 'utf8');
              const fm = parseFrontMatter(existing);
              const firstFeatured = fm.first_featured || digestDate;
              const timesFeatured = (parseInt(fm.times_featured) || 0) + 1;
              const updatedFm = [
                '---',
                'layout: repo',
                `name: "${safeName}"`,
                `source: ${source}`,
                `item_url: "${url}"`,
                `description: "${safeBlurb}"`,
                `category: "${category || fm.category || ''}"`,
                `language: "${lang || fm.language || ''}"`,
                `stars: ${stars || parseInt(fm.stars) || 0}`,
                `downloads: ${downloads || parseInt(fm.downloads) || 0}`,
                `likes: ${likes || parseInt(fm.likes) || 0}`,
                `og_image: "${og_image || fm.og_image || ''}"`,
                `first_featured: "${firstFeatured}"`,
                `last_featured: "${digestDate}"`,
                `times_featured: ${timesFeatured}`,
                `streak: ${streak}`,
                `appearances: ${appearances}`,
                `star_velocity: ${starVelocity}`,
                `tags: [${tags.join(', ')}]`,
                `icp_tags: [${icpTags.map(t => JSON.stringify(t)).join(', ')}]`,
                '---'
              ].join('\n');
              fs.writeFileSync(filePath, updatedFm + '\n\n' + blurb + '\n');
            } else {
              // Create new entry
              const newEntry = [
                '---',
                'layout: repo',
                `name: "${safeName}"`,
                `source: ${source}`,
                `item_url: "${url}"`,
                `description: "${safeBlurb}"`,
                `category: "${category || ''}"`,
                `language: "${lang}"`,
                `stars: ${stars}`,
                `downloads: ${downloads}`,
                `likes: ${likes}`,
                `og_image: "${og_image}"`,
                `first_featured: "${digestDate}"`,
                `last_featured: "${digestDate}"`,
                `times_featured: 1`,
                `streak: ${streak}`,
                `appearances: ${appearances}`,
                `star_velocity: ${starVelocity}`,
                `tags: [${tags.join(', ')}]`,
                `icp_tags: [${icpTags.map(t => JSON.stringify(t)).join(', ')}]`,
                '---'
              ].join('\n');
              fs.writeFileSync(filePath, newEntry + '\n\n' + blurb + '\n');
            }
            return slug;
          }

          // ── Main ───────────────────────────────────────────
          (async () => {
          // Find latest GitHub repos data file
          const dataFiles = fs.readdirSync('data')
            .filter(f => f.match(/^repos-\d{4}-\d{2}-\d{2}\.json$/))
            .sort()
            .reverse();

          if (dataFiles.length === 0) {
            console.log('No data files found. Exiting.');
            process.exit(0);
          }

          const latestFile = `data/${dataFiles[0]}`;

          // Always use today's UTC date for the digest post — never derive it
          // from the data filename, or stale data files will block generation.
          const digestDate = new Date().toISOString().slice(0, 10);

          const postPath = `_posts/${digestDate}-github-digest.md`;
          if (fs.existsSync(postPath)) {
            console.log(`Digest for ${digestDate} already exists. Skipping.`);
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(latestFile, 'utf8'));
          const prefs = JSON.parse(fs.readFileSync('config/preferences.json', 'utf8'));

          // ── Load all seen ledgers ───────────────────────────
          const seen = loadSeenLedger('seen.json');
          const seenHf = loadSeenLedger('seen-hf.json');
          const seenReplicate = loadSeenLedger('seen-replicate.json');
          const seenPwc = loadSeenLedger('seen-paperswithcode.json');
          const seenNpmPypi = loadSeenLedger('seen-npm-pypi.json');
          const seenGitlab = loadSeenLedger('seen-gitlab.json');
          const seenOllama = loadSeenLedger('seen-ollama.json');
          const seenLaunches = loadSeenLedger('seen-launches.json');

          let spotlight = { repos: [] };
          try {
            spotlight = JSON.parse(fs.readFileSync('config/spotlight.json', 'utf8'));
          } catch (e) { /* no spotlights */ }

          const today = new Date(digestDate);

          // ── Load all platform data ──────────────────────────
          const hfData = loadLatestDataFile('hf') || { spaces: [], models: [], datasets: [] };
          const replicateData = loadLatestDataFile('replicate') || { models: [] };
          const pwcData = loadLatestDataFile('paperswithcode') || { papers: [] };
          const npmPypiData = loadLatestDataFile('npm-pypi') || { npm: [], pypi: [] };
          const gitlabData = loadLatestDataFile('gitlab') || { repos: [] };
          const ollamaData = loadLatestDataFile('ollama') || { models: [] };
          const launchesData = loadLatestDataFile('launches') || { launches: [] };

          // ── Health check ────────────────────────────────────
          const health = {
            date: digestDate,
            sources: {
              github: { loaded: data.repos?.length || 0 },
              huggingface: { loaded: (hfData.spaces?.length || 0) + (hfData.models?.length || 0) + (hfData.datasets?.length || 0) },
              replicate: { loaded: replicateData.models?.length || 0 },
              paperswithcode: { loaded: pwcData.papers?.length || 0 },
              npm: { loaded: npmPypiData.npm?.length || 0 },
              pypi: { loaded: npmPypiData.pypi?.length || 0 },
              gitlab: { loaded: gitlabData.repos?.length || 0 },
              ollama: { loaded: ollamaData.models?.length || 0 },
              launches: { loaded: launchesData.launches?.length || 0 }
            }
          };

          // ── Filter GitHub repos ─────────────────────────────
          const candidates = data.repos.filter(r => {
            if (isOnCooldown(seen, r.full_name, today, prefs.cooldown_days)) return false;
            const minStars = r._source === 'trending'
              ? prefs.min_stars_trending
              : prefs.min_stars;
            if ((r.stargazers_count || 0) < minStars) return false;
            if (!monthsAgo(r.pushed_at, prefs.recent_months)) return false;
            return true;
          });

          for (const sr of spotlight.repos) {
            if (!isOnCooldown(seen, sr.full_name, today, prefs.cooldown_days)) {
              candidates.push({
                ...sr,
                stargazers_count: sr.stargazers_count || 0,
                language: sr.language || null,
                topics: sr.topics || [],
                _source: 'spotlight',
                _query_group: 'spotlight'
              });
            }
          }

          if (candidates.length === 0) {
            console.log('No interesting repos after filtering. No digest today.');
            process.exit(0);
          }

          // ── Categorize GitHub repos ─────────────────────────
          const sections = {
            'SaaS starters and templates': [],
            'AI agents, LLM infra and RAG': [],
            'Ops, analytics and automation': [],
            'Marketing, sales and GTM tools': [],
            'UGC, social media and creator tools': [],
          };
          const trendingPool = [];
          const uncategorized = [];

          for (const r of candidates) {
            if (r._source === 'trending') {
              trendingPool.push(r);
              continue;
            }
            const cat = assignCategory(r);
            if (cat && sections[cat]) {
              sections[cat].push(r);
            } else {
              uncategorized.push(r);
            }
          }

          for (const key of Object.keys(sections)) {
            sections[key].sort((a, b) => b.stargazers_count - a.stargazers_count);
            sections[key] = sections[key].slice(0, prefs.max_repos_per_section);
          }

          const TWO_YEARS_MS = 2 * 365 * 24 * 60 * 60 * 1000;
          const trendingFiltered = trendingPool.filter(r => {
            if (r.stargazers_count > 80000) {
              const created = r.created_at ? new Date(r.created_at) : null;
              if (!created || (today - created) > TWO_YEARS_MS) {
                console.log(`Skipping perennial mega-repo from trending: ${r.full_name} (${r.stargazers_count}★)`);
                return false;
              }
            }
            return true;
          });

          trendingFiltered.sort((a, b) => b.stargazers_count - a.stargazers_count);
          const trendingCandidates = trendingFiltered.slice(0, prefs.max_trending_candidates);
          const trendingFeatured = trendingCandidates.slice(0, prefs.max_trending_featured);
          const trendingAlso = trendingCandidates.slice(
            prefs.max_trending_featured,
            prefs.max_trending_featured + prefs.max_trending_also
          );

          const trendingOddballs = [];
          for (const r of trendingFeatured) {
            const cat = assignCategory(r);
            if (cat && sections[cat] && sections[cat].length < prefs.max_repos_per_section) {
              sections[cat].push(r);
            } else {
              trendingOddballs.push(r);
            }
          }

          // ── Velocity-boosted trending ─────────────────────
          const hotness = (() => {
            try { return JSON.parse(fs.readFileSync('data/hotness.json', 'utf8')); }
            catch (e) { return {}; }
          })();

          const alreadyAssigned = new Set();
          for (const items of Object.values(sections)) {
            for (const r of items) alreadyAssigned.add(r.full_name);
          }
          for (const r of trendingOddballs) alreadyAssigned.add(r.full_name);
          for (const r of trendingAlso) alreadyAssigned.add(r.full_name);

          const velocityTrending = candidates
            .filter(r => {
              const h = hotness[r.full_name];
              return h && h.star_velocity && h.star_velocity >= 50;
            })
            .filter(r => !alreadyAssigned.has(r.full_name))
            .filter(r => !isOnCooldown(seen, r.full_name, today, prefs.cooldown_days))
            .sort((a, b) => {
              const va = (hotness[a.full_name] || {}).star_velocity || 0;
              const vb = (hotness[b.full_name] || {}).star_velocity || 0;
              return vb - va;
            })
            .slice(0, 3);

          const trendingNames = new Set(trendingOddballs.map(r => r.full_name));
          for (const r of velocityTrending) {
            if (!trendingNames.has(r.full_name)) {
              trendingOddballs.push(r);
            }
          }

          // ── Trim to global max ──────────────────────────────
          let totalPicks = trendingOddballs.length + trendingAlso.length;
          for (const key of Object.keys(sections)) {
            totalPicks += sections[key].length;
          }

          while (totalPicks > prefs.max_repos_total) {
            let largestSection = null;
            let largestCount = 0;
            for (const key of Object.keys(sections)) {
              if (sections[key].length > largestCount) {
                largestCount = sections[key].length;
                largestSection = key;
              }
            }
            if (!largestSection || largestCount <= 1) break;
            sections[largestSection].pop();
            totalPicks--;
          }

          // ── Filter HuggingFace items ────────────────────────
          const hfSpaces = (hfData.spaces || [])
            .filter(s => !isOnCooldown(seenHf, s.id, today, prefs.cooldown_days) && s.likes >= 10)
            .sort((a, b) => b.likes - a.likes)
            .slice(0, prefs.max_hf_spaces);

          const hfModels = (hfData.models || [])
            .filter(m => !isOnCooldown(seenHf, m.id, today, prefs.cooldown_days) && m.downloads >= 1000)
            .sort((a, b) => b.downloads - a.downloads)
            .slice(0, prefs.max_hf_models);

          const hfDatasets = (hfData.datasets || [])
            .filter(d => !isOnCooldown(seenHf, d.id, today, prefs.cooldown_days) && d.downloads >= 500)
            .sort((a, b) => b.downloads - a.downloads)
            .slice(0, prefs.max_hf_datasets);

          console.log(`HuggingFace: ${hfSpaces.length} spaces, ${hfModels.length} models, ${hfDatasets.length} datasets`);

          // ── Filter Replicate models ─────────────────────────
          const replicateModels = (replicateData.models || [])
            .filter(m => !isOnCooldown(seenReplicate, m.id, today, prefs.cooldown_days))
            .sort((a, b) => (b.run_count || 0) - (a.run_count || 0))
            .slice(0, prefs.max_replicate_models);
          console.log(`Replicate: ${replicateModels.length} models`);

          // ── Filter Papers with Code ─────────────────────────
          const papers = (pwcData.papers || [])
            .filter(p => !isOnCooldown(seenPwc, p.id, today, prefs.cooldown_days))
            .sort((a, b) => (b.github_stars || 0) - (a.github_stars || 0))
            .slice(0, prefs.max_papers);
          console.log(`Papers with Code: ${papers.length} papers`);

          // ── Filter npm packages ─────────────────────────────
          const npmPkgs = (npmPypiData.npm || [])
            .filter(p => !isOnCooldown(seenNpmPypi, `npm-${p.id}`, today, prefs.cooldown_days))
            .sort((a, b) => (b.weekly_downloads || 0) - (a.weekly_downloads || 0))
            .slice(0, prefs.max_npm);
          console.log(`npm: ${npmPkgs.length} packages`);

          // ── Filter PyPI packages ────────────────────────────
          const pypiPkgs = (npmPypiData.pypi || [])
            .filter(p => !isOnCooldown(seenNpmPypi, `pypi-${p.id}`, today, prefs.cooldown_days))
            .sort((a, b) => (b.recent_downloads || 0) - (a.recent_downloads || 0))
            .slice(0, prefs.max_pypi);
          console.log(`PyPI: ${pypiPkgs.length} packages`);

          // ── Filter GitLab repos ─────────────────────────────
          const gitlabRepos = (gitlabData.repos || [])
            .filter(r => !isOnCooldown(seenGitlab, r.id, today, prefs.cooldown_days))
            .sort((a, b) => (b.star_count || 0) - (a.star_count || 0))
            .slice(0, prefs.max_gitlab);
          console.log(`GitLab: ${gitlabRepos.length} repos`);

          // ── Filter Ollama models ────────────────────────────
          const ollamaModels = (ollamaData.models || [])
            .filter(m => !isOnCooldown(seenOllama, m.id, today, prefs.cooldown_days))
            .sort((a, b) => {
              const pa = (a.pull_count || '').replace(/[+,]/g, '');
              const pb = (b.pull_count || '').replace(/[+,]/g, '');
              return (parseFloat(pb) || 0) - (parseFloat(pa) || 0);
            })
            .slice(0, prefs.max_ollama);
          console.log(`Ollama: ${ollamaModels.length} models`);

          // ── Filter Launches ─────────────────────────────────
          const launches = (launchesData.launches || [])
            .filter(l => !isOnCooldown(seenLaunches, l.id, today, prefs.cooldown_days))
            .sort((a, b) => (b.upvotes || 0) - (a.upvotes || 0))
            .slice(0, prefs.max_launches);
          console.log(`Launches: ${launches.length} items`);

          // ── Generate Gemini editorial blurbs ────────────────
          const allSectioned = { ...sections };
          if (trendingOddballs.length > 0) allSectioned['Trending oddballs'] = trendingOddballs;
          if (trendingAlso.length > 0) allSectioned['Also trending'] = trendingAlso;

          if (hfSpaces.length > 0) allSectioned['HuggingFace Spaces'] = hfSpaces.map(s => ({
            full_name: s.id, description: s.description, language: s.sdk || 'Space',
            stargazers_count: s.likes, topics: s.tags
          }));
          if (hfModels.length > 0) allSectioned['HuggingFace Models'] = hfModels.map(m => ({
            full_name: m.id, description: m.description, language: m.pipeline_tag,
            stargazers_count: m.downloads, topics: m.tags
          }));
          if (hfDatasets.length > 0) allSectioned['HuggingFace Datasets'] = hfDatasets.map(d => ({
            full_name: d.id, description: d.description, language: 'Dataset',
            stargazers_count: d.downloads, topics: d.tags
          }));

          if (replicateModels.length > 0) allSectioned['Replicate Models'] = replicateModels.map(m => ({
            full_name: m.id, description: m.description, language: 'Model',
            stargazers_count: m.run_count || 0, topics: []
          }));
          if (papers.length > 0) allSectioned['Papers to Code'] = papers.map(p => ({
            full_name: p.id, description: p.title + ': ' + (p.abstract || '').slice(0, 100),
            language: 'Paper', stargazers_count: p.github_stars || 0, topics: p.tasks || []
          }));
          if (npmPkgs.length > 0) allSectioned['npm Packages'] = npmPkgs.map(p => ({
            full_name: p.id, description: p.description, language: 'JavaScript',
            stargazers_count: p.weekly_downloads || 0, topics: p.keywords || []
          }));
          if (pypiPkgs.length > 0) allSectioned['PyPI Packages'] = pypiPkgs.map(p => ({
            full_name: p.id, description: p.description, language: 'Python',
            stargazers_count: p.recent_downloads || 0, topics: p.keywords || []
          }));
          if (gitlabRepos.length > 0) allSectioned['GitLab Repos'] = gitlabRepos.map(r => ({
            full_name: r.full_name, description: r.description, language: r.language || 'Multi',
            stargazers_count: r.star_count || 0, topics: r.topics || []
          }));
          if (ollamaModels.length > 0) allSectioned['Ollama Models'] = ollamaModels.map(m => ({
            full_name: m.id, description: m.description, language: 'Model',
            stargazers_count: 0, topics: m.tags || []
          }));
          if (launches.length > 0) allSectioned['New Launches'] = launches.map(l => ({
            full_name: l.id, description: l.description || l.name,
            language: l._source, stargazers_count: l.upvotes || 0, topics: []
          }));

          const blurbs = await generateEditorialBlurbs(candidates, allSectioned);

          // ── Compare-to validation + override + slug pruning ──
          let compareToData = blurbs || {};
          const generatorModel = process.env.LAST_LLM_MODEL_USED || 'unknown';
          if (compareToData && Object.keys(compareToData).length > 0) {
            // Adversarial cross-family validation
            compareToData = await validateCompareTo(compareToData, generatorModel, process.env);

            // Merge manual overrides (per-field; missing keys preserve LLM output)
            let overrides = {};
            try {
              overrides = JSON.parse(fs.readFileSync('config/compare-to-overrides.json', 'utf8'));
            } catch (e) {
              console.warn('Override file unreadable, proceeding without overrides:', e.message);
            }
            compareToData = mergeOverrides(compareToData, overrides);

            // Drop similar_to slugs that don't exist in _repos/
            const knownSlugs = new Set();
            if (fs.existsSync('_repos')) {
              for (const f of fs.readdirSync('_repos')) {
                if (f.endsWith('.md')) knownSlugs.add(f.replace(/\.md$/, ''));
              }
            }
            compareToData = validateSlugs(compareToData, knownSlugs);

            // Disputes log (debug artifact, not committed long-term)
            const disputesPath = `data/compare-to-disputes-${digestDate}.json`;
            const disputes = {};
            for (const [k, v] of Object.entries(compareToData)) {
              if (v.compare_to_validated === false) disputes[k] = 'unvalidated';
            }
            if (Object.keys(disputes).length > 0) {
              fs.writeFileSync(disputesPath, JSON.stringify(disputes, null, 2));
            }
          }

          // ── Build Markdown ──────────────────────────────────
          const sep = '---';
          const hfCount = hfSpaces.length + hfModels.length + hfDatasets.length;
          const platformCount = replicateModels.length + papers.length + npmPkgs.length +
            pypiPkgs.length + gitlabRepos.length + ollamaModels.length + launches.length;
          const extraNote = (hfCount + platformCount) > 0
            ? ` Plus ${hfCount + platformCount} picks from HuggingFace, Replicate, Papers with Code, npm, PyPI, GitLab, Ollama, and launch platforms.`
            : '';

          const allTags = ['github', 'huggingface', 'replicate', 'paperswithcode', 'npm', 'pypi', 'gitlab', 'ollama', 'launches', 'digest', 'ai', 'saas', 'solopreneur', 'ugc'];

          let md = `${sep}\nlayout: post\ntitle: "Daily Digest – ${digestDate}"\ndate: ${digestDate}\ntags: [${allTags.join(', ')}]\n${sep}\n\nDaily curated repos and tools for solo founders, AI/B2B SaaS builders, and small business tools. ${candidates.length} repos evaluated, ${totalPicks} made the cut.${extraNote}\n\n`;

          // ── Peter's Picks (new since last digest) ──────────────
          try {
            // Find the date of the most recent previous digest
            const prevPosts = fs.readdirSync('_posts')
              .filter(f => f.match(/^\d{4}-\d{2}-\d{2}-github-digest\.md$/))
              .sort();
            const lastDigestDate = prevPosts.length > 0
              ? prevPosts[prevPosts.length - 1].match(/^(\d{4}-\d{2}-\d{2})/)[1]
              : null;

            if (fs.existsSync('_tools')) {
              const newPicks = fs.readdirSync('_tools')
                .filter(f => f.endsWith('.md'))
                .map(f => parseFrontMatter(fs.readFileSync(`_tools/${f}`, 'utf8')))
                .filter(fm => fm.name && fm.date_added && (!lastDigestDate || fm.date_added > lastDigestDate));

              if (newPicks.length > 0) {
                md += `## Peter's Picks\n\n`;
                for (const pick of newPicks) {
                  const hook = pick.hook || pick.one_liner || pick.description || '';
                  const icp = pick.primary_icp ? ` *(${pick.primary_icp})*` : '';
                  const picksUrl = pick.url || '';
                  md += `- [${pick.name}](${picksUrl}) – ${hook}${icp} → [full review](/VaiBReport/picks/${pick.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')}/)\n\n`;
                }
                console.log(`Added ${newPicks.length} Peter's Pick(s) to digest`);
              } else {
                console.log(`No new Peter's Picks since ${lastDigestDate || 'ever'}`);
              }
            }
          } catch (e) {
            console.log('Peter\'s Picks check skipped:', e.message);
          }

          const sectionOrder = [
            'SaaS starters and templates',
            'AI agents, LLM infra and RAG',
            'Ops, analytics and automation',
            'Marketing, sales and GTM tools',
            'UGC, social media and creator tools',
          ];

          const featured = [];

          for (const name of sectionOrder) {
            if (sections[name].length === 0) continue;
            md += `## ${name}\n\n`;
            for (const r of sections[name]) {
              md += writeOneLiner(r, blurbs) + '\n\n';
              featured.push(r.full_name);
            }
          }

          if (trendingOddballs.length > 0) {
            md += `## Trending oddballs worth a look\n\n`;
            for (const r of trendingOddballs) {
              const h = hotness[r.full_name];
              const velocityNote = (h && h.star_velocity > 0) ? ` ⚡${h.star_velocity}★/day` : '';
              const lang = r.language || 'Multi';
              const stars = formatStars(r.stargazers_count);
              const blurb = (blurbs && blurbs[r.full_name]?.blurb)
                ? blurbs[r.full_name].blurb
                : (r.description || 'No description provided.');
              md += `- [${r.full_name}](${r.html_url}) – ${blurb} (${lang}, ${stars}${velocityNote})\n\n`;
              featured.push(r.full_name);
            }
          }

          if (trendingAlso.length > 0) {
            md += `### Also trending today\n\n`;
            for (const r of trendingAlso) {
              const lang = r.language || 'Multi';
              const h = hotness[r.full_name];
              const velocityNote = (h && h.star_velocity > 0) ? ` ⚡${h.star_velocity}★/day` : '';
              const blurb = (blurbs && blurbs[r.full_name]?.blurb)
                ? blurbs[r.full_name].blurb
                : (r.description || '').slice(0, 60);
              md += `- [${r.full_name}](${r.html_url}) – ${blurb} (${lang}, ${formatStars(r.stargazers_count)}${velocityNote})\n`;
              featured.push(r.full_name);
            }
            md += '\n';
          }

          // ── GitLab Repos section ────────────────────────────
          const gitlabFeatured = [];
          if (gitlabRepos.length > 0) {
            md += `## GitLab Repos\n\n`;
            for (const r of gitlabRepos) {
              const blurb = (blurbs && blurbs[r.full_name]?.blurb) ? blurbs[r.full_name].blurb : (r.description || r.full_name);
              md += `- [${r.full_name}](${r.url}) – ${blurb} (${r.language || 'Multi'}, ${formatStars(r.star_count || 0)})\n\n`;
              gitlabFeatured.push(r.id);
            }
          }

          // ── Papers to Code section ──────────────────────────
          const papersFeatured = [];
          if (papers.length > 0) {
            md += `## Papers to Code\n\n`;
            for (const p of papers) {
              const blurb = (blurbs && blurbs[p.id]?.blurb) ? blurbs[p.id].blurb : (p.title || p.id);
              md += `- [${p.title}](${p.url}) – ${blurb} ([code](${p.github_url}), ${formatStars(p.github_stars || 0)})\n\n`;
              papersFeatured.push(p.id);
            }
          }

          // ── Replicate Models section ────────────────────────
          const replicateFeatured = [];
          if (replicateModels.length > 0) {
            md += `## Replicate Models\n\n`;
            for (const m of replicateModels) {
              const blurb = (blurbs && blurbs[m.id]?.blurb) ? blurbs[m.id].blurb : (m.description || m.id);
              const runs = m.run_count ? `${formatDownloads(m.run_count)} runs` : '';
              md += `- [${m.id}](${m.url}) – ${blurb}${runs ? ` (${runs})` : ''}\n\n`;
              replicateFeatured.push(m.id);
            }
          }

          // ── Ollama Models section ───────────────────────────
          const ollamaFeatured = [];
          if (ollamaModels.length > 0) {
            md += `## Ollama Models\n\n`;
            for (const m of ollamaModels) {
              const blurb = (blurbs && blurbs[m.id]?.blurb) ? blurbs[m.id].blurb : (m.description || m.id);
              const pulls = m.pull_count ? `${m.pull_count} pulls` : '';
              md += `- [${m.id}](${m.url}) – ${blurb}${pulls ? ` (${pulls})` : ''}\n\n`;
              ollamaFeatured.push(m.id);
            }
          }

          // ── npm Packages section ────────────────────────────
          const npmFeatured = [];
          if (npmPkgs.length > 0) {
            md += `## npm Packages\n\n`;
            for (const p of npmPkgs) {
              const blurb = (blurbs && blurbs[p.id]?.blurb) ? blurbs[p.id].blurb : (p.description || p.id);
              md += `- [${p.id}](${p.url}) – ${blurb} (${formatDownloads(p.weekly_downloads || 0)}/wk)\n\n`;
              npmFeatured.push(`npm-${p.id}`);
            }
          }

          // ── PyPI Packages section ───────────────────────────
          const pypiFeatured = [];
          if (pypiPkgs.length > 0) {
            md += `## PyPI Packages\n\n`;
            for (const p of pypiPkgs) {
              const blurb = (blurbs && blurbs[p.id]?.blurb) ? blurbs[p.id].blurb : (p.description || p.id);
              md += `- [${p.id}](${p.url}) – ${blurb} (${formatDownloads(p.recent_downloads || 0)} recent downloads)\n\n`;
              pypiFeatured.push(`pypi-${p.id}`);
            }
          }

          // ── HuggingFace sections ────────────────────────────
          const hfFeatured = [];

          if (hfSpaces.length > 0) {
            md += `## HuggingFace Spaces\n\n`;
            for (const s of hfSpaces) {
              const blurb = (blurbs && blurbs[s.id]?.blurb) ? blurbs[s.id].blurb : (s.description || s.id);
              md += `- [${s.id}](${s.url}) – ${blurb} (${s.sdk || 'Space'}, ${s.likes} likes)\n\n`;
              hfFeatured.push(s.id);
            }
          }

          if (hfModels.length > 0) {
            md += `## HuggingFace Models\n\n`;
            for (const m of hfModels) {
              const blurb = (blurbs && blurbs[m.id]?.blurb) ? blurbs[m.id].blurb : (m.description || m.id);
              md += `- [${m.id}](${m.url}) – ${blurb} (${m.pipeline_tag}, ${formatDownloads(m.downloads)} downloads)\n\n`;
              hfFeatured.push(m.id);
            }
          }

          if (hfDatasets.length > 0) {
            md += `## HuggingFace Datasets\n\n`;
            for (const d of hfDatasets) {
              const blurb = (blurbs && blurbs[d.id]?.blurb) ? blurbs[d.id].blurb : (d.description || d.id);
              md += `- [${d.id}](${d.url}) – ${blurb} (${formatDownloads(d.downloads)} downloads)\n\n`;
              hfFeatured.push(d.id);
            }
          }

          // ── New Launches section ────────────────────────────
          const launchesFeatured = [];
          if (launches.length > 0) {
            md += `## New Launches\n\n`;
            for (const l of launches) {
              const blurb = (blurbs && blurbs[l.id]?.blurb) ? blurbs[l.id].blurb : (l.description || l.name);
              const votes = l.upvotes ? ` (${l.upvotes} upvotes)` : '';
              const src = l._source ? ` [${l._source}]` : '';
              md += `- [${l.name}](${l.url}) – ${blurb}${votes}${src}\n\n`;
              launchesFeatured.push(l.id);
            }
          }

          // ── Write post ──────────────────────────────────────
          if (!fs.existsSync('_posts')) fs.mkdirSync('_posts', { recursive: true });
          fs.writeFileSync(postPath, md);
          console.log(`Created ${postPath} with ${featured.length} repos + ${hfFeatured.length} HF + ${platformCount} platform items`);

          // ── Update all seen ledgers ─────────────────────────
          for (const name of featured) { markSeen(seen, name, digestDate); }
          fs.writeFileSync('data/seen.json', JSON.stringify(seen, null, 2));

          for (const id of hfFeatured) { markSeen(seenHf, id, digestDate); }
          fs.writeFileSync('data/seen-hf.json', JSON.stringify(seenHf, null, 2));

          for (const id of replicateFeatured) { markSeen(seenReplicate, id, digestDate); }
          fs.writeFileSync('data/seen-replicate.json', JSON.stringify(seenReplicate, null, 2));

          for (const id of papersFeatured) { markSeen(seenPwc, id, digestDate); }
          fs.writeFileSync('data/seen-paperswithcode.json', JSON.stringify(seenPwc, null, 2));

          for (const id of [...npmFeatured, ...pypiFeatured]) { markSeen(seenNpmPypi, id, digestDate); }
          fs.writeFileSync('data/seen-npm-pypi.json', JSON.stringify(seenNpmPypi, null, 2));

          for (const id of gitlabFeatured) { markSeen(seenGitlab, id, digestDate); }
          fs.writeFileSync('data/seen-gitlab.json', JSON.stringify(seenGitlab, null, 2));

          for (const id of ollamaFeatured) { markSeen(seenOllama, id, digestDate); }
          fs.writeFileSync('data/seen-ollama.json', JSON.stringify(seenOllama, null, 2));

          for (const id of launchesFeatured) { markSeen(seenLaunches, id, digestDate); }
          fs.writeFileSync('data/seen-launches.json', JSON.stringify(seenLaunches, null, 2));

          // ── Clean spotlight ──────────────────────────────────
          if (spotlight.repos.length > 0) {
            spotlight.repos = spotlight.repos.filter(
              sr => !featured.includes(sr.full_name)
            );
            fs.writeFileSync(
              'config/spotlight.json',
              JSON.stringify(spotlight, null, 2)
            );
          }

          // ── Create _repos/ catalog entries ─────────────────
          if (!fs.existsSync('_repos')) fs.mkdirSync('_repos', { recursive: true });

          let hotnessData = {};
          try {
            hotnessData = JSON.parse(fs.readFileSync('data/hotness.json', 'utf8'));
          } catch (e) { /* no hotness data */ }

          let repoSlugs = 0;
          // GitHub repos (from sections + trending)
          for (const sectionName of Object.keys(sections)) {
            for (const r of sections[sectionName]) {
              if (createRepoEntry(r, 'github', sectionName, blurbs, hotnessData, digestDate)) repoSlugs++;
            }
          }
          for (const r of trendingOddballs) {
            if (createRepoEntry(r, 'github', 'Trending', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          for (const r of trendingAlso) {
            if (createRepoEntry(r, 'github', 'Trending', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // GitLab
          for (const r of gitlabRepos) {
            if (createRepoEntry({ ...r, full_name: r.full_name, id: r.id }, 'gitlab', 'GitLab Repos', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // Papers
          for (const p of papers) {
            if (createRepoEntry(p, 'paperswithcode', 'Papers to Code', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // Replicate
          for (const m of replicateModels) {
            if (createRepoEntry(m, 'replicate', 'Replicate Models', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // Ollama
          for (const m of ollamaModels) {
            if (createRepoEntry(m, 'ollama', 'Ollama Models', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // npm
          for (const p of npmPkgs) {
            if (createRepoEntry({ ...p, id: p.id }, 'npm', 'npm Packages', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // PyPI
          for (const p of pypiPkgs) {
            if (createRepoEntry({ ...p, id: p.id }, 'pypi', 'PyPI Packages', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // HuggingFace
          for (const s of hfSpaces) {
            if (createRepoEntry({ ...s, name: s.id }, 'huggingface-space', 'HuggingFace Spaces', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          for (const m of hfModels) {
            if (createRepoEntry({ ...m, name: m.id }, 'huggingface-model', 'HuggingFace Models', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          for (const d of hfDatasets) {
            if (createRepoEntry({ ...d, name: d.id }, 'huggingface-dataset', 'HuggingFace Datasets', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          // Launches
          for (const l of launches) {
            if (createRepoEntry(l, 'launch', 'New Launches', blurbs, hotnessData, digestDate)) repoSlugs++;
          }
          console.log(`Created/updated ${repoSlugs} _repos/ catalog entries`);

          // ── README media enrichment ─────────────────────────
          // For newly featured GitHub repos, try to extract a real
          // product screenshot or demo GIF from the README.
          let readmeUpdates = 0;
          for (const fullName of featured.slice(0, 15)) {
            const slug = toSlug(fullName);
            const filePath = `_repos/${slug}.md`;
            if (!fs.existsSync(filePath)) continue;
            const content = fs.readFileSync(filePath, 'utf8');
            if (content.includes('readme_image:')) continue; // already enriched
            const readmeImg = await fetchReadmeImage(fullName);
            if (readmeImg) {
              const updated = content.replace(
                /^(og_image:)/m,
                `readme_image: "${readmeImg}"\n$1`
              );
              fs.writeFileSync(filePath, updated);
              readmeUpdates++;
            }
          }
          if (readmeUpdates > 0) console.log(`README enrichment: ${readmeUpdates} images added`);

          // ── Write health check ──────────────────────────────
          health.sources.github.featured = featured.length;
          health.sources.huggingface.featured = hfFeatured.length;
          health.sources.replicate.featured = replicateFeatured.length;
          health.sources.paperswithcode.featured = papersFeatured.length;
          health.sources.npm.featured = npmFeatured.length;
          health.sources.pypi.featured = pypiFeatured.length;
          health.sources.gitlab.featured = gitlabFeatured.length;
          health.sources.ollama.featured = ollamaFeatured.length;
          health.sources.launches.featured = launchesFeatured.length;
          health.total_featured = featured.length + hfFeatured.length + replicateFeatured.length +
            papersFeatured.length + npmFeatured.length + pypiFeatured.length +
            gitlabFeatured.length + ollamaFeatured.length + launchesFeatured.length;
          health.gemini_blurbs = blurbs ? Object.keys(blurbs).length : 0;

          fs.writeFileSync(`data/health-${digestDate}.json`, JSON.stringify(health, null, 2));
          console.log(`Health check: ${JSON.stringify(health.sources)}`);

          console.log(`Updated seen ledgers. Total entries: GH=${Object.keys(seen.featured).length} HF=${Object.keys(seenHf.featured).length} Replicate=${Object.keys(seenReplicate.featured).length} PwC=${Object.keys(seenPwc.featured).length} npm/PyPI=${Object.keys(seenNpmPypi.featured).length} GitLab=${Object.keys(seenGitlab.featured).length} Ollama=${Object.keys(seenOllama.featured).length} Launches=${Object.keys(seenLaunches.featured).length}`);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          SCRIPT

      - name: Commit and push
        run: |
          date=$(date -u +"%Y-%m-%d")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ _repos/ data/seen*.json data/health-*.json config/spotlight.json
          git diff --cached --quiet && echo "No new digest" && exit 0
          git commit -m "Add digest for ${date}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
