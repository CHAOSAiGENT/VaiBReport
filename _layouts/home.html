---
layout: default
---

<div style="margin-bottom:2rem;">
  <div class="sys-label" style="margin-bottom:0.75rem;">CORE_STREAM // DAILY_DIGEST</div>
  <div style="font-size:0.82rem;color:var(--ink-dim);line-height:1.6;">{{ content }}</div>
</div>

{% if site.posts.size > 0 %}
<div class="panel-border">
  <div class="panel-header">
    <span class="sys-label">RECENT_DIGESTS</span>
  </div>
  {% for post in site.posts limit:10 %}
  <div class="data-row">
    <span style="font-size:0.6rem;letter-spacing:0.06em;color:var(--ink-muted);min-width:6rem;flex-shrink:0;">{{ post.date | date: "%Y-%m-%d" }}</span>
    <a href="{{ post.url | relative_url }}" style="color:var(--ink);font-family:var(--font-disp);font-size:0.82rem;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none;flex:1;">{{ post.title }}</a>
  </div>
  {% endfor %}
</div>
{% endif %}
