title: VaiBReport
description: >-
  Daily curated tools, repos, models, and launches from GitHub,
  HuggingFace, Replicate, GitLab, npm, PyPI, Ollama, Papers with Code,
  and indie launch platforms. Built for solo founders, AI builders,
  and small business tool seekers.
url: "https://chaosaigent.github.io"
baseurl: "/VaiBReport"

# Build settings
markdown: kramdown
theme: minima
permalink: /:year/:month/:day/:title/

# Collections
collections:
  repos:
    output: true
    permalink: /repos/:name/
  tools:
    output: true
    permalink: /picks/:name/
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: "repos"
    values:
      layout: "repo"
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"
      peters_pick: true
      create_content: true
      content_created: false
      public: false
  - scope:
      path: ""
      type: "research"
    values:
      layout: "research"
      public: false

# Navigation
header_pages:
  - repos.md
  - picks.md
  - leaderboard.md
  - about.md

# Excludes
exclude:
  - data/
  - config/
  - static/
  - README.md
  - CONTEXT.md
  - VaiBReport-SPEC.md
  - CLAUDE-CODE-SETUP-PROMPT.md
  - COWORK-DIGEST-PROMPT.md
  - CLAUDE-CODE-V1-FINALIZE.md
  - "*.pdf"
  - node_modules/
  - package.json
  - package-lock.json
  - .gitignore
  - "V2-*.md"
  - "CLAUDE-CODE-*.md"
  - postmvp/
  - me2/
  - docs/
  - tasks/
